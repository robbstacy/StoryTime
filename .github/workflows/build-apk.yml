name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedtimecast-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BedtimeCast (latest build)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Debug build of BedtimeCast from the latest `main`.

            **Install on your phone:** open this page on the phone, download
            `app-debug.apk`, tap it, and allow "install unknown apps" when asked.
